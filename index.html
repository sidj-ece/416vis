<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COVID-19 Vaccination Narrative Viz</title>
    <style>
        body { font-family: sans-serif; margin: 30px; text-align: center; }
        .chart-container { margin-top: 20px; display: inline-block; }
        button { padding: 8px 16px; margin: 0 5px; cursor: pointer; }
        .axis label { font-size: 12px; }
    </style>
</head>
<body>

    <h1>Global COVID-19 Vaccination Progress</h1>
    <p id="scene-description">A martini-glass narrative viz showing data pertaining to global vaccination trends for COVID-19. Sourced from https://ourworldindata.org/covid-vaccinations.</p>

    <div id="controls">
        <button onclick="changeScene(1)">Scene 1: Rollout</button>
        <button onclick="changeScene(2)">Scene 2: Wealth Inequality == Vaccine Inequality</button>
        <button onclick="changeScene(3)">Scene 3: Free Roam</button>
    </div>

    <div class="chart-container">
        <svg width="700" height="400"></svg>
    </div>

    <div id="scene3-controls" style="margin-bottom: 15px; display: none;">
        <input type="text" id="country-input" placeholder="e.g., United States, Argentina, Germany" style="padding: 5px; width: 200px;">
        <button onclick="handleCountrySearch()">Plot Country</button>
        <span id="error-msg" style="color: red; font-size: 12px; margin-left: 10px;"></span>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
